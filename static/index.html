<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工伤事故调查与纠正措施</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.5rem}</style></head><body><h1>工伤事故调查与纠正措施</h1><p>记录工伤经过、伤害、现场和证人，维护调查、纠正措施、验证与关闭流程；整改措施按编号跨事故共用，验收结论变更后引用事故退回核验。</p><p>严重度越高、伤害指数越大或未关闭措施越多，优先级越高；严重事故必须在4小时内启动调查。</p><button onclick="loadItems()">刷新事故</button><button onclick="loadMeasures()">刷共用措施台账</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>const H={'X-Actor':'demo','X-Role':'viewer'};async function get(u){const r=await fetch(u,{headers:H});return await r.json()}async function loadItems(){document.getElementById('out').textContent=JSON.stringify(await get('/api/items'),null,2)}async function loadMeasures(){document.getElementById('out').textContent=JSON.stringify(await get('/api/measures'),null,2)}</script></body></html>
